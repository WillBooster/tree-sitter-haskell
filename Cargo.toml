[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "Haskell grammar for tree-sitter"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "haskell"]
license = "MIT"
name = "willbooster-tree-sitter-haskell"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-haskell"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = [
  "/bindings/rust/*",
  "/grammar.js",
  "/hsc/grammar.js",
  "/hsc/src/**",
  "/grammar/*.js",
  "/src/*",
  "!/src/.*",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
name = "tree_sitter_haskell"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "15.0.0" }
